name: ci-cd

# Pull request: compila, testa, constroi a imagem e escaneia vulnerabilidades.
# Push na main: alem disso publica no ACR com tag versionada e faz deploy no AKS
# (Rolling Update, sem downtime). O que esta em main e o que esta em producao.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC com o Azure: nenhuma senha/chave armazenada no GitHub

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  SERVICE: catalog-api
  IMAGE_NAME: fcg-catalog-api
  PROJECT: src/FCG.CatalogAPI/FCG.CatalogAPI.csproj
  TEST_PROJECT: tests/FCG.Catalog.Tests/FCG.Catalog.Tests.csproj

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }} && dotnet restore ${{ env.TEST_PROJECT }}

      - name: Build
        run: dotnet build ${{ env.PROJECT }} -c Release --no-restore

      - name: Testes unitarios
        run: >
          dotnet test ${{ env.TEST_PROJECT }} -c Release --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/

  image:
    name: Docker image, scan & push
    needs: build-test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Versionamento da imagem
        id: meta
        run: |
          VERSION="1.0.${{ github.run_number }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}:${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem (local, para escanear antes de publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Informativo por padrao. Para bloquear o deploy em vulnerabilidades,
          # crie a variavel de repositorio TRIVY_BLOCK=true.
          exit-code: ${{ vars.TRIVY_BLOCK == 'true' && '1' || '0' }}

      - name: Login no Azure (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push para o ACR (tags versionadas)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ACR="${{ vars.ACR_NAME }}"
          az acr login --name "$ACR"
          REG="${ACR}.azurecr.io/${IMAGE_NAME}"
          docker tag "${IMAGE_NAME}:scan" "${REG}:${{ steps.meta.outputs.version }}"
          docker tag "${IMAGE_NAME}:scan" "${REG}:sha-${{ steps.meta.outputs.short_sha }}"
          docker tag "${IMAGE_NAME}:scan" "${REG}:latest"
          docker push --all-tags "${REG}"

  deploy:
    name: Deploy no AKS (Rolling Update)
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_NAME }}

      - name: Aplicar manifestos (a imagem nova vem da tag versionada)
        env:
          IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ needs.image.outputs.version }}
        run: envsubst '${IMAGE}' < k8s/deployment.yaml | kubectl apply -f -

      - name: Aguardar o rollout (falha = rollback automatico)
        run: |
          if ! kubectl rollout status deployment/${SERVICE} -n fcg --timeout=300s; then
            echo "::error::Rollout falhou; revertendo para a revisao anterior."
            kubectl rollout undo deployment/${SERVICE} -n fcg
            exit 1
          fi

      - name: Resumo
        run: |
          kubectl get pods -n fcg -l app=${SERVICE} -o wide
          echo "### Deploy ${SERVICE} ${{ needs.image.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Imagem: \`${{ vars.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${{ needs.image.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
