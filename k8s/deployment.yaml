# Aplicado pela pipeline: envsubst substitui ${IMAGE} (ACR + tag versionada) antes do kubectl apply.
# Nenhum segredo aqui: valores sensiveis vem do Secret "fcg-secrets" (Key Vault) via secretKeyRef;
# as connection strings sao montadas no pod com a sintaxe $(VAR) do Kubernetes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: fcg
  labels: { app: catalog-api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  # Rolling Update sem downtime: sobe 1 pod novo, so derruba um antigo quando o novo
  # passa no readinessProbe (maxUnavailable: 0).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: { app: catalog-api }
  template:
    metadata:
      labels: { app: catalog-api }
    spec:
      containers:
        - name: catalog-api
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: fcg-config }
          env:
            - name: SQL_SA_PASSWORD
              valueFrom: { secretKeyRef: { name: fcg-secrets, key: SQL_SA_PASSWORD } }
            - name: MONGO_USER
              valueFrom: { secretKeyRef: { name: fcg-secrets, key: MONGO_USER } }
            - name: MONGO_PASSWORD
              valueFrom: { secretKeyRef: { name: fcg-secrets, key: MONGO_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: fcg-secrets, key: REDIS_PASSWORD } }
            - name: RabbitMQ__Username
              valueFrom: { secretKeyRef: { name: fcg-secrets, key: RABBITMQ_USER } }
            - name: RabbitMQ__Password
              valueFrom: { secretKeyRef: { name: fcg-secrets, key: RABBITMQ_PASSWORD } }
            - name: Jwt__Secret
              valueFrom: { secretKeyRef: { name: fcg-secrets, key: JWT_SECRET } }
            - name: Elasticsearch__Password
              valueFrom: { secretKeyRef: { name: fcg-secrets, key: ELASTIC_PASSWORD } }
            - name: ConnectionStrings__DefaultConnection
              value: "Server=sqlserver;Database=FCG_Catalog;User Id=SA;Password=$(SQL_SA_PASSWORD);TrustServerCertificate=True;"
            - name: ConnectionStrings__MongoDB
              value: "mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@mongodb:27017"
            - name: ConnectionStrings__Redis
              value: "redis:6379,password=$(REDIS_PASSWORD)"
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 384Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: fcg
  labels: { app: catalog-api }
spec:
  selector: { app: catalog-api }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog-api
  namespace: fcg
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: catalog-api }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog-api
  namespace: fcg
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: catalog-api }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
